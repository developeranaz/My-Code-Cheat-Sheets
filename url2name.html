<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Filename Extractor</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
    }
    textarea, input, pre {
      width: 100%;
      margin-top: 10px;
      font-family: monospace;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea {
      height: 150px;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 12px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    .copy-button {
      background-color: #008CBA;
      margin-left: 10px;
      padding: 8px 15px;
    }
    .copy-button:hover {
      background-color: #007399;
    }
    .output-section {
      margin-top: 25px;
      padding: 15px;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .input-group {
      position: relative;
      margin-bottom: 15px;
    }
    .copy-btn-container {
      position: absolute;
      right: 5px;
      top: 5px;
    }
    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      button {
        width: 100%;
        margin-top: 8px;
      }
      .copy-button {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <h2>URL to Filename Extractor</h2>

  <div class="input-group">
    <label>Paste URLs here:</label>
    <textarea id="urlInput" placeholder="Paste URLs here..."></textarea>
    <div class="copy-btn-container">
      <button onclick="copyToClipboard('urlInput')" class="copy-button">Copy</button>
    </div>
  </div>

  <div class="input-group">
    <label>Text Pattern to Remove from Filenames:</label>
    <input type="text" id="customFilter" value="www.* - " placeholder="e.g. www.* - " />
    <div class="help-text">
      Use "www.* - " to remove patterns like "www.1TamilMV.tube - ", "www.1blasters.ibe - ", etc.
      <br>Or enter exact text to remove (e.g., "www.example.com - ")
    </div>
    <div class="copy-btn-container">
      <button onclick="copyToClipboard('customFilter')" class="copy-button">Copy</button>
    </div>
  </div>

  <button onclick="extractFilenames()">Extract Filenames</button>

  <div class="output-section">
    <h3>Parsed URLs:</h3>
    <pre id="urlOutput"></pre>
    <button onclick="copyToClipboard('urlOutput')" class="copy-button">Copy URLs</button>
  </div>

  <div class="output-section">
    <h3>Filenames:</h3>
    <pre id="output"></pre>
    <button onclick="copyToClipboard('output')" class="copy-button">Copy Filenames</button>
  </div>

  <script>
    function extractFilenames() {
      const input = document.getElementById('urlInput').value;
      const filterText = document.getElementById('customFilter').value;
      
      // Split URLs using positive lookahead for http/https patterns
      const urls = input.trim().split(/(?=\s*https?:)/i)
        .map(url => url.trim())
        .filter(url => url);

      // Display parsed URLs
      document.getElementById('urlOutput').textContent = urls.join('\n');

      // Process filenames
      const filenames = urls.map(url => {
        let filename = '';
        try {
          const parsedUrl = new URL(url);
          filename = parsedUrl.pathname.split('/').pop() || '';
        } catch (e) {
          // Fallback manual extraction for invalid URLs
          const cleanUrl = url.split(/[?#]/)[0]; // Remove query/hash
          filename = cleanUrl.split('/').pop() || '';
        }
        
        try {
          filename = decodeURIComponent(filename);
        } catch(e) {
          // Handle invalid URI components
        }
        
        if (filterText) {
          // Check if using wildcard pattern (www.* - )
          if (filterText.includes('*')) {
            // Convert pattern to regex
            // This handles patterns like "www.* - " to match "www.anything - "
            const regexPattern = filterText
              .replace(/[.+?^${}()|[\]\\]/g, '\\$&') // Escape special chars except *
              .replace(/\*/g, '[^\\s]*'); // Replace * with non-whitespace matcher
            
            const regex = new RegExp('^' + regexPattern, 'i');
            filename = filename.replace(regex, '');
          } else {
            // Exact text removal
            filename = filename.replace(filterText, '');
          }
        }
        return filename;
      });

      document.getElementById('output').textContent = filenames.join('\n');
    }

    function copyToClipboard(elementId) {
      const element = document.getElementById(elementId);
      // Get the text to copy: for input/textarea use .value, for others use .textContent
      const text = element.value || element.textContent;

      // Try using the modern Clipboard API first
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          alert('Copied to clipboard!');
        }).catch(err => {
          console.error('Clipboard API failed, trying fallback:', err);
          fallbackCopy(text);
        });
      } else {
        // Clipboard API not available, use fallback
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      // Create a temporary textarea element
      const textarea = document.createElement('textarea');
      textarea.value = text;
      // Make it invisible
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      textarea.style.pointerEvents = 'none';
      document.body.appendChild(textarea);
      
      // Select and copy
      textarea.select();
      textarea.setSelectionRange(0, 99999); // For mobile devices
      
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          alert('Copied to clipboard!');
        } else {
          alert('Copy failed. Please copy manually.');
        }
      } catch (err) {
        console.error('Fallback copy error:', err);
        alert('Copy failed. Please copy manually.');
      }
      
      // Clean up
      document.body.removeChild(textarea);
    }
  </script>
</body>
</html>
