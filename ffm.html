<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Splitter - No Re-encoding</title>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
      max-width: 600px;
      width: 100%;
    }
    
    h2 {
      color: #333;
      margin-bottom: 25px;
      font-size: 24px;
      text-align: center;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: #555;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px dashed #667eea;
      border-radius: 8px;
      background: #f8f9ff;
      cursor: pointer;
      font-size: 14px;
    }
    
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border 0.3s;
    }
    
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }
    
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    #progress {
      margin-top: 20px;
      padding: 20px;
      background: #f8f9ff;
      border-radius: 8px;
      display: none;
    }
    
    .progress-bar {
      width: 100%;
      height: 30px;
      background: #e0e0e0;
      border-radius: 15px;
      overflow: hidden;
      margin: 10px 0;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }
    
    .progress-text {
      text-align: center;
      color: #555;
      font-size: 14px;
      margin-top: 10px;
      font-weight: 600;
    }
    
    #log {
      margin-top: 15px;
      padding: 15px;
      background: #fff9e6;
      border-left: 4px solid #ffc107;
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }
    
    #results {
      margin-top: 20px;
    }
    
    .download-link {
      display: block;
      padding: 12px 15px;
      background: #4caf50;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 600;
      transition: background 0.3s;
    }
    
    .download-link:hover {
      background: #45a049;
    }
    
    .info-box {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
      color: #1976d2;
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
      
      h2 {
        font-size: 20px;
      }
      
      button {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📽️ Video Splitter (No Re-encoding)</h2>
    
    <div class="info-box">
      ℹ️ This tool splits your video into chunks without re-encoding (fast & lossless). All processing happens in your browser.
    </div>
    
    <div class="input-group">
      <label for="inputVideo">Select Video File:</label>
      <input type="file" id="inputVideo" accept="video/*">
    </div>
    
    <div class="input-group">
      <label for="clipLength">Clip Length (seconds):</label>
      <input type="number" id="clipLength" value="46" min="1">
    </div>
    
    <div class="input-group">
      <label for="overlap">Overlap (seconds):</label>
      <input type="number" id="overlap" value="7" min="0">
    </div>
    
    <button id="processBtn">Split Video</button>
    
    <div id="progress">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
      <div class="progress-text" id="progressText">Initializing...</div>
    </div>
    
    <div id="log"></div>
    <div id="results"></div>
  </div>

  <script type="module">
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile } = FFmpegWASM;
    
    const ffmpeg = new FFmpeg();
    const logDiv = document.getElementById('log');
    const resultsDiv = document.getElementById('results');
    const progressDiv = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const processBtn = document.getElementById('processBtn');

    let isLoaded = false;

    function log(msg) {
      logDiv.style.display = 'block';
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `[${time}] ${msg}<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateProgress(current, total, message) {
      const percent = Math.round((current / total) * 100);
      progressFill.style.width = percent + '%';
      progressFill.textContent = percent + '%';
      progressText.textContent = message;
    }

    async function getVideoDuration(fileName) {
      return new Promise((resolve, reject) => {
        let durationFound = false;
        
        ffmpeg.on('log', ({ message }) => {
          const durationMatch = message.match(/Duration: (\d{2}):(\d{2}):(\d{2}\.\d{2})/);
          if (durationMatch && !durationFound) {
            const hours = parseInt(durationMatch[1]);
            const minutes = parseInt(durationMatch[2]);
            const seconds = parseFloat(durationMatch[3]);
            const totalSeconds = hours * 3600 + minutes * 60 + seconds;
            durationFound = true;
            resolve(totalSeconds);
          }
        });

        ffmpeg.exec(['-i', fileName]).catch(() => {
          if (durationFound) {
            resolve(0);
          } else {
            reject(new Error('Could not determine video duration'));
          }
        });

        setTimeout(() => {
          if (!durationFound) {
            reject(new Error('Timeout getting duration'));
          }
        }, 10000);
      });
    }

    document.getElementById('processBtn').onclick = async () => {
      const fileInput = document.getElementById('inputVideo');
      if (!fileInput.files.length) {
        alert("Please select a video file first!");
        return;
      }

      const file = fileInput.files[0];
      const clipLength = parseInt(document.getElementById('clipLength').value);
      const overlap = parseInt(document.getElementById('overlap').value);

      if (clipLength <= 0) {
        alert("Clip length must be greater than 0");
        return;
      }

      if (overlap < 0 || overlap >= clipLength) {
        alert("Overlap must be between 0 and clip length");
        return;
      }

      processBtn.disabled = true;
      resultsDiv.innerHTML = '';
      logDiv.innerHTML = '';
      progressDiv.style.display = 'block';

      try {
        if (!isLoaded) {
          updateProgress(0, 100, 'Loading FFmpeg.wasm...');
          log("⏳ Loading FFmpeg.wasm (this may take a moment)...");
          
          const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
          await ffmpeg.load({
            coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
            wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
          });
          
          isLoaded = true;
          log("✅ FFmpeg.wasm loaded successfully");
        }

        updateProgress(10, 100, 'Writing video file...');
        log(`📁 Writing file: ${file.name}`);
        await ffmpeg.writeFile(file.name, await fetchFile(file));

        updateProgress(20, 100, 'Detecting video duration...');
        log("🔍 Analyzing video duration...");
        const duration = await getVideoDuration(file.name);
        log(`⏱️ Video duration: ${duration.toFixed(2)} seconds`);

        const step = clipLength - overlap;
        const numChunks = Math.ceil((duration - overlap) / step);
        
        log(`📊 Will create ${numChunks} chunks (${clipLength}s each, ${overlap}s overlap)`);

        let start = 0;
        let index = 1;

        for (let i = 0; i < numChunks; i++) {
          const outputFile = `part_${String(index).padStart(3, '0')}.mp4`;
          const progressBase = 20 + (i / numChunks) * 70;
          
          updateProgress(
            progressBase, 
            100, 
            `Processing chunk ${index}/${numChunks} (${start.toFixed(1)}s - ${(start + clipLength).toFixed(1)}s)`
          );
          
          log(`✂️ Creating: ${outputFile} (start=${start.toFixed(2)}s, length=${clipLength}s)`);

          await ffmpeg.exec([
            '-ss', String(start),
            '-i', file.name,
            '-t', String(clipLength),
            '-c', 'copy',
            '-avoid_negative_ts', 'make_zero',
            outputFile
          ]);

          const data = await ffmpeg.readFile(outputFile);
          const blob = new Blob([data], { type: 'video/mp4' });
          const url = URL.createObjectURL(blob);

          const a = document.createElement('a');
          a.href = url;
          a.download = outputFile;
          a.textContent = `📥 Download ${outputFile} (${(blob.size / 1024 / 1024).toFixed(2)} MB)`;
          a.className = 'download-link';
          resultsDiv.appendChild(a);

          await ffmpeg.deleteFile(outputFile);

          start += step;
          index++;

          if (start >= duration) break;
        }

        updateProgress(100, 100, `✅ Complete! Created ${index - 1} video chunks`);
        log(`🎉 Splitting complete! Created ${index - 1} files.`);
        
        await ffmpeg.deleteFile(file.name);

      } catch (error) {
        log(`❌ Error: ${error.message}`);
        console.error(error);
        alert(`Error: ${error.message}`);
      } finally {
        processBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
